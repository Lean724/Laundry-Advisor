[tool.ruff]
target-version = "py313"
line-length = 88
src = ["custom_components"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "ANN401",
  "ARG001",
  "COM812",
  "CPY",
  "D203",
  "D213",
  "EM101",
  "PLR2004",
  "TC",
  "TRY003",
  "UP040"
]

[tool.ruff.lint.per-file-ignores]
"custom_components/laundry_advisor/localization.py" = ["RUF001"]
"custom_components/laundry_advisor/translations/*.json" = ["ALL"]
"tests/*" = ["ANN", "D", "PT009", "S101", "UP017", "UP036"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
strict = true
disallow_subclassing_any = false
disallow_untyped_decorators = false
warn_return_any = false
warn_unused_ignores = false
warn_unused_configs = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
module = [
  "homeassistant",
  "homeassistant.*",
  "voluptuous",
  "voluptuous.*"
]
ignore_missing_imports = true

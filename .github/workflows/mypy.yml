name: MyPy

on:
  push:
  pull_request:

jobs:
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - name: Run MyPy
        run: |
          output=$(mypy custom_components/laundry_advisor 2>&1) || {
            echo "$output"
            echo "::error title=MyPy Errors::$output"
            exit 1
          }
          echo "$output"
